<div class="container">
  <h1>Posts</h1>
  <a routerLink="/admin/posts/new" class="btn btn-primary mb-3">New Post</a>
  <table class="table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let post of posts$ | async">
        <td>{{ post.title }}</td>
        <td>
          <ng-container *ngIf="post.id">
            <a [routerLink]="['/admin/posts/edit', post.id]" class="btn btn-sm btn-primary">Edit</a>
            <button (click)="deletePost(post.id)" class="btn btn-sm btn-danger ml-2">Delete</button>
          </ng-container>
        </td>
      </tr>
    </tbody>
  </table>
</div>
