<div class="post-edit-container">
  <h1 *ngIf="editMode">Edit Post</h1>
  <h1 *ngIf="!editMode">New Post</h1>
  <form [formGroup]="postForm" (ngSubmit)="savePost()">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" formControlName="title" class="form-control">
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <quill-editor formControlName="content" [modules]="quillConfig" (onEditorCreated)="onEditorCreated($event)"></quill-editor>
    </div>
    <button type="submit" [disabled]="!postForm.valid" class="btn btn-primary">Save</button>
  </form>
</div>
