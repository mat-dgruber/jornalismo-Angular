<div class="dashboard-container">
  <h1>Dashboard</h1>
  <button [routerLink]="['/admin/post-edit']" class="btn btn-primary">Novo Post</button>
  <ul class="post-list">
    <li *ngFor="let post of posts$ | async" class="post-item">
      <span>{{ post.title }}</span>
      <button [routerLink]="['/admin/post-edit', post.id]" class="btn btn-secondary">Edit</button>
    </li>
  </ul>
</div>
