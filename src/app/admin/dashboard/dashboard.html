<div class="dashboard-container">
  <h1>Dashboard</h1>
  <div class="actions">
    <button [routerLink]="['/admin/posts/new']" class="btn btn-primary">Novo Post</button>
    <button [routerLink]="['/admin/posts']" class="btn btn-secondary">Ver Todos os Posts</button>
  </div>
  <h2>Últimos Posts</h2>
  <ul class="post-list">
    <li *ngFor="let post of posts$ | async" class="post-item">
      <span>{{ post.title }}</span>
      <button [routerLink]="['/admin/posts/edit', post.id]" class="btn btn-secondary">Edit</button>
    </li>
  </ul>
</div>
