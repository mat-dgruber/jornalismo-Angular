<header class="header">
  <div class="container">
    <h1 class="logo"><a routerLink="/">Maria Izabela</a></h1>
    <nav class="navbar">
      <button
        class="menu-toggle"
        (click)="toggleMenu()"
        aria-label="Abrir menu"
      >
        &#9776;
      </button>
      <ul class="nav-links" [class.active]="isMenuOpen">
        @if (isHomePage()) {
        <li><a href="#materias" (click)="closeMenu()">Artigos</a></li>
        <li><a href="#projetos" (click)="closeMenu()">Projetos</a></li>
        <li>
          <a routerLink="/materiais" (click)="closeMenu()">Materiais</a>
        </li>
        <li><a href="#contato" (click)="closeMenu()">Contato</a></li>
        } @else {
        <li>
          <a [routerLink]="'/artigos'" fragment="materias" (click)="closeMenu()"
            >Artigos</a
          >
        </li>
        <li>
          <a
            [routerLink]="['/blog']"
            fragment="blog-recentes"
            (click)="closeMenu()"
            >Blog</a
          >
        </li>
        <li>
          <a [routerLink]="'/materiais'" (click)="closeMenu()">Materiais</a>
        </li>
        <li>
          <a
            [routerLink]="'/projetos'"
            fragment="projetos"
            (click)="closeMenu()"
            >Projetos</a
          >
        </li>
        <li>
          <a [routerLink]="'/contato'" fragment="contato" (click)="closeMenu()"
            >Contato</a
          >
        </li>
        }
        <!--<li><a href="#midia">Áudio & Vídeo</a></li>
                    <li><a href="#fotografia">Fotografia & Multimídia</a></li> -->
        <!-- <li><a href="#blog-recentes">Blog</a></li> -->
        <!--<li><a href="biografia.html">Sobre Mim</a></li> -->
      </ul>
    </nav>
  </div>
</header>
