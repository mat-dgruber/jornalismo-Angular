<header class="header">
  <div class="container">
    <h1 class="logo">
      <a routerLink="/" aria-label="Maria Izabela — início">
        <img
          src="assets/Imagens/Mabelaaaa-logo-transparente.webp"
          alt="Maria Izabela"
          class="logo-img"
          width="975"
          height="814"
          decoding="async"
        />
      </a>
    </h1>
    <nav class="navbar">
      <button
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        [attr.aria-label]="isMenuOpen ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
      >
        &#9776;
      </button>
      <ul class="nav-links" [class.active]="isMenuOpen">
        @if (isHomePage()) {
          <li><a href="#materias" (click)="closeMenu()">Artigos</a></li>
          <li><a href="#materiais" (click)="closeMenu()">Materiais</a></li>
          <li><a href="#projetos" (click)="closeMenu()">Projetos</a></li>
          <li><a href="#contato" (click)="closeMenu()">Contato</a></li>
        } @else {
          <li>
            <a
              [routerLink]="'/artigos'"
              fragment="materias"
              (click)="closeMenu()"
              >Artigos</a
            >
          </li>
          <li>
            <a
              [routerLink]="['/blog']"
              fragment="blog-recentes"
              (click)="closeMenu()"
              >Blog</a
            >
          </li>
          <li>
            <a [routerLink]="'/materiais'" (click)="closeMenu()">Materiais</a>
          </li>
          <li>
            <a
              [routerLink]="'/projetos'"
              fragment="projetos"
              (click)="closeMenu()"
              >Projetos</a
            >
          </li>
          <li>
            <a
              [routerLink]="'/contato'"
              fragment="contato"
              (click)="closeMenu()"
              >Contato</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
