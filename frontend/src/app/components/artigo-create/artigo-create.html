<div class="card">
  <h2>{{ isEditMode ? "Editar Artigo" : "Novo Artigo" }}</h2>

  <form
    [formGroup]="artigoForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-column gap-4"
  >
    <div class="grid">
      <div class="col-12 md:col-8">
        <label for="titulo" class="block mb-2 font-bold">Título</label>
        <input
          pInputText
          id="titulo"
          formControlName="titulo"
          class="w-full"
          placeholder="Digite o título do artigo"
        />
      </div>

      <div class="col-12 md:col-4">
        <label for="local" class="block mb-2 font-bold"
          >Local de Publicação</label
        >
        <input
          pInputText
          id="local"
          formControlName="local_publicacao"
          class="w-full"
          placeholder="Ex: Revista X, Blog Y"
        />
      </div>

      <div class="col-12 mt-3">
        <label for="subtitulo" class="block mb-2 font-bold"
          >Subtítulo (Opcional)</label
        >
        <input
          pInputText
          id="subtitulo"
          formControlName="subtitulo"
          class="w-full"
          placeholder="Digite um subtítulo curto"
        />
      </div>

      <div class="col-12 md:col-6 mt-3">
        <label for="data" class="block mb-2 font-bold"
          >Data de Publicação</label
        >
        <p-datepicker
          id="data"
          formControlName="data_publicacao"
          [showTime]="true"
          dateFormat="dd/mm/yy"
          styleClass="w-full"
          [showIcon]="true"
        ></p-datepicker>
      </div>

      <div class="col-12 md:col-6 mt-3">
        <label for="link" class="block mb-2 font-bold"
          >Link Externo (Opcional)</label
        >
        <input
          pInputText
          id="link"
          formControlName="link_externo"
          class="w-full"
          placeholder="https://..."
        />
      </div>

      <div class="col-12 mt-3">
        <label for="content" class="block mb-2 font-bold">Conteúdo</label>
        <p-editor formControlName="conteudo" [style]="{ height: '400px' }">
          <p-header>
            <span class="ql-formats">
              <select class="ql-header">
                <option value="1">Título 1</option>
                <option value="2">Título 2</option>
                <option value="3">Título 3</option>
                <option selected>Normal</option>
              </select>
              <select class="ql-font"></select>
            </span>
            <span class="ql-formats">
              <button class="ql-bold" aria-label="Negrito"></button>
              <button class="ql-italic" aria-label="Itálico"></button>
              <button class="ql-underline" aria-label="Sublinhado"></button>
              <button class="ql-strike" aria-label="Tachado"></button>
            </span>
            <span class="ql-formats">
              <select class="ql-color"></select>
              <select class="ql-background"></select>
            </span>
            <span class="ql-formats">
              <button class="ql-list" value="ordered" aria-label="Lista Ordenada"></button>
              <button class="ql-list" value="bullet" aria-label="Lista com Marcadores"></button>
              <select class="ql-align"></select>
            </span>
            <span class="ql-formats">
              <button class="ql-link" aria-label="Inserir Link"></button>
              <button class="ql-image" aria-label="Inserir Imagem"></button>
              <button class="ql-video" aria-label="Inserir Vídeo"></button>
              <button class="ql-blockquote" aria-label="Citação"></button>
              <button class="ql-code-block" aria-label="Bloco de Código"></button>
            </span>
            <span class="ql-formats">
              <button class="ql-clean" aria-label="Limpar Formatação"></button>
            </span>
          </p-header>
        </p-editor>
      </div>

      <div class="col-12 mt-3">
        <label for="image" class="block mb-2 font-bold">Imagem de Capa</label>
        <input
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="w-full"
        />

        @if (currentImageUrl) {
        <div class="mt-2">
          <p class="text-sm text-gray-500">Imagem atual:</p>
          <img
            [src]="currentImageUrl"
            alt="Capa atual"
            class="h-10rem border-round shadow-2"
          />
        </div>
        }
      </div>
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <p-button
        label="Cancelar"
        routerLink="/admin/artigos"
        styleClass="p-button-text"
      ></p-button>
      <p-button
        [label]="submitLabel"
        type="submit"
        [disabled]="artigoForm.invalid"
      ></p-button>
    </div>
  </form>
</div>
