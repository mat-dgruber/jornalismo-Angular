<div class="card">
  <div class="flex justify-content-between mb-3">
    <h2>Gerenciar Postagens</h2>
    <p-button
      label="Nova Postagem"
      icon="pi pi-plus"
      routerLink="/post/create"
    ></p-button>
  </div>

  <p-table
    [value]="posts"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%">Imagem</th>
        <th style="width: 30%">Título</th>
        <th style="width: 20%">Autor</th>
        <th style="width: 15%">Data</th>
        <th style="width: 20%">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-post>
      <tr>
        <td>
          @if (post.image) {
          <img
            [src]="post.image"
            [alt]="post.title"
            width="80"
            class="shadow-4 border-round"
            style="object-fit: cover; aspect-ratio: 16/9"
          />
          }
        </td>
        <td class="font-bold">{{ post.title }}</td>
        <td>{{ post.author_first_name || post.author }}</td>
        <td>{{ post.published_date | date : "dd/MM/yyyy" }}</td>
        <td>
          <div class="flex gap-2">
            <p-button
              severity="info"
              [rounded]="true"
              [text]="true"
              [routerLink]="['/post/editar', post.slug]"
              pTooltip="Editar"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
            </p-button>
            <p-button
              severity="danger"
              [rounded]="true"
              [text]="true"
              (onClick)="deletePost(post.slug!)"
              pTooltip="Excluir"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-confirmDialog></p-confirmDialog>
</div>
