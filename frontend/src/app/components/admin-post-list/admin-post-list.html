<div class="admin-list-container">
  <div class="admin-list-card">
    <header class="admin-list-header">
      <h2>Gerenciar Postagens</h2>
      <p-button
        label="Nova Postagem"
        icon="pi pi-plus"
        routerLink="/post/create"
        styleClass="btn-admin-main"
      ></p-button>
    </header>

    <p-table
      [value]="posts"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 12%">Capa</th>
          <th style="width: 35%">Título</th>
          <th style="width: 20%">Categoria</th>
          <th style="width: 13%">Data</th>
          <th style="width: 20%">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-post>
        <tr>
          <td>
            @if (post.image) {
              <img
                [src]="post.image"
                [alt]="post.title"
                width="70"
                class="shadow-2 border-round"
                style="object-fit: cover; aspect-ratio: 16/9"
              />
            } @else {
              <div class="bg-light border-round flex align-center justify-center" style="width: 70px; aspect-ratio: 16/9">
                <i class="pi pi-image text-secondary"></i>
              </div>
            }
          </td>
          <td class="font-bold text-primary">{{ post.title }}</td>
          <td>
            <span class="status-tag status-tag-warning">{{ post.category }}</span>
          </td>
          <td class="text-secondary">{{ post.published_date | date : "dd/MM/yyyy" }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                severity="info"
                [rounded]="true"
                [text]="true"
                [routerLink]="['/post/editar', post.slug]"
                pTooltip="Editar Post"
              >
                <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
              </p-button>
              <p-button
                severity="danger"
                [rounded]="true"
                [text]="true"
                (onClick)="deletePost(post.slug!)"
                pTooltip="Excluir Post"
              >
                <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <p-confirmDialog></p-confirmDialog>
</div>
