<div class="card">
  <div class="flex justify-content-between mb-3">
    <h2>Gerenciar Artigos</h2>
    <p-button
      label="Novo Artigo"
      icon="pi pi-plus"
      routerLink="/artigos/novo"
    ></p-button>
  </div>

  <p-table
    [value]="artigos"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%">Imagem</th>
        <th style="width: 30%">Título</th>
        <th style="width: 20%">Local</th>
        <th style="width: 15%">Data</th>
        <th style="width: 20%">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-artigo>
      <tr>
        <td>
          @if (artigo.imagem) {
          <img
            [src]="artigo.imagem"
            [alt]="artigo.titulo"
            width="80"
            class="shadow-4 border-round"
            style="object-fit: cover; aspect-ratio: 16/9"
          />
          }
        </td>
        <td class="font-bold">{{ artigo.titulo }}</td>
        <td>{{ artigo.local_publicacao }}</td>
        <td>{{ artigo.data_publicacao | date : "dd/MM/yyyy" }}</td>
        <td>
          <div class="flex gap-2">
            <p-button
              severity="info"
              [rounded]="true"
              [text]="true"
              [routerLink]="['/artigos/editar', artigo.slug]"
              pTooltip="Editar"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
            </p-button>
            <p-button
              severity="danger"
              [rounded]="true"
              [text]="true"
              (onClick)="deleteArtigo(artigo.slug!)"
              pTooltip="Excluir"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-confirmDialog></p-confirmDialog>
</div>
