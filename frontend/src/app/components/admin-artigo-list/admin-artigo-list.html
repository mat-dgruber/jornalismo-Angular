<div class="admin-list-container">
  <div class="admin-list-card">
    <header class="admin-list-header">
      <h2>Gerenciar Artigos</h2>
      <p-button
        label="Novo Artigo"
        icon="pi pi-plus"
        routerLink="/artigos/novo"
        styleClass="btn-admin-main"
      ></p-button>
    </header>

    <p-table
      [value]="artigos"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 12%">Capa</th>
          <th style="width: 35%">Título</th>
          <th style="width: 20%">Local</th>
          <th style="width: 13%">Data</th>
          <th style="width: 20%">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-artigo>
        <tr>
          <td>
            @if (artigo.imagem) {
              <img
                [src]="artigo.imagem"
                [alt]="artigo.titulo"
                width="70"
                class="shadow-2 border-round"
                style="object-fit: cover; aspect-ratio: 16/9"
              />
            } @else {
              <div class="bg-light border-round flex align-center justify-center" style="width: 70px; aspect-ratio: 16/9">
                <i class="pi pi-image text-secondary"></i>
              </div>
            }
          </td>
          <td class="font-bold text-primary">{{ artigo.titulo }}</td>
          <td>
            <span class="status-tag status-tag-info">{{ artigo.local_publicacao }}</span>
          </td>
          <td class="text-secondary">{{ artigo.data_publicacao | date : "dd/MM/yyyy" }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                severity="info"
                [rounded]="true"
                [text]="true"
                [routerLink]="['/artigos/editar', artigo.slug]"
                pTooltip="Editar Artigo"
              >
                <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
              </p-button>
              <p-button
                severity="danger"
                [rounded]="true"
                [text]="true"
                (onClick)="deleteArtigo(artigo.slug!)"
                pTooltip="Excluir Artigo"
              >
                <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <p-confirmDialog></p-confirmDialog>
</div>
