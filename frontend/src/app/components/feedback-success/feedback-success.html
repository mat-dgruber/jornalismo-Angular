<div class="feedback-container">
  <p-card styleClass="feedback-card">
    <i class="pi pi-check-circle success-icon"></i>
    <h2>Parabéns!</h2>
    <p class="text-xl mb-4">{{ message }}</p>

    <div class="flex justify-content-center flex-wrap gap-2">
      <p-button
        [label]="actionLabel"
        (onClick)="goBack()"
        severity="secondary"
        outlined="true"
      ></p-button>
      <p-button
        *ngIf="createUrl"
        [label]="createLabel"
        (onClick)="createNew()"
        severity="success"
      ></p-button>
    </div>
  </p-card>
</div>
