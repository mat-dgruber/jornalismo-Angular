<div class="card">
  <div class="flex justify-content-between mb-3">
    <h2>Gerenciar Materiais</h2>
    <p-button
      label="Novo Material"
      icon="pi pi-plus"
      routerLink="/materiais/novo"
    ></p-button>
  </div>

  <p-table
    [value]="materiais"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%">Imagem</th>
        <th style="width: 25%">Nome</th>
        <th style="width: 15%">Categoria</th>
        <th style="width: 15%">Tipo</th>
        <th style="width: 15%">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-material>
      <tr>
        <td>
          <img
            [src]="material.image"
            [alt]="material.name"
            width="80"
            class="shadow-4 border-round"
            style="object-fit: cover; aspect-ratio: 16/9"
          />
        </td>
        <td class="font-bold">{{ material.name }}</td>
        <td>
          <span class="p-tag p-tag-info">{{
            material.category | uppercase
          }}</span>
        </td>
        <td>
          <span
            [class]="
              'p-tag ' +
              (material.type === 'gratuito' ? 'p-tag-success' : 'p-tag-warning')
            "
          >
            {{ material.type | uppercase }}
          </span>
        </td>
        <td>
          <div class="flex gap-2">
            <p-button
              severity="info"
              [rounded]="true"
              [text]="true"
              [routerLink]="['/materiais/editar', material.id]"
              pTooltip="Editar"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
            </p-button>
            <p-button
              severity="danger"
              [rounded]="true"
              [text]="true"
              (onClick)="deleteMaterial(material.id)"
              pTooltip="Excluir"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-confirmDialog></p-confirmDialog>
</div>
