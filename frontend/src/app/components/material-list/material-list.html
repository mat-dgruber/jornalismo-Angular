<div class="admin-list-container">
  <div class="admin-list-card">
    <header class="admin-list-header">
      <h2>Gerenciar Materiais</h2>
      <p-button
        label="Novo Material"
        icon="pi pi-plus"
        routerLink="/materiais/novo"
        styleClass="btn-admin-main"
      ></p-button>
    </header>

    <p-table
      [value]="materiais"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 12%">Capa</th>
          <th style="width: 30%">Nome</th>
          <th style="width: 18%">Categoria</th>
          <th style="width: 20%">Tipo / Preço</th>
          <th style="width: 20%">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-material>
        <tr>
          <td>
            <img
              [src]="material.image"
              [alt]="material.name"
              width="70"
              class="shadow-2 border-round"
              style="object-fit: cover; aspect-ratio: 16/9"
            />
          </td>
          <td class="font-bold text-primary">{{ material.name }}</td>
          <td>
            <span class="status-tag status-tag-info">{{ material.category }}</span>
          </td>
          <td>
            <span class="status-tag" [ngClass]="material.type === 'gratuito' ? 'status-tag-success' : 'status-tag-warning'">
              {{ material.type === 'gratuito' ? 'GRATUITO' : (material.price | currency:'BRL') }}
            </span>
          </td>
          <td>
            <div class="flex gap-2">
              <p-button
                severity="info"
                [rounded]="true"
                [text]="true"
                [routerLink]="['/materiais/editar', material.slug]"
                pTooltip="Editar Material"
              >
                <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
              </p-button>
              <p-button
                severity="danger"
                [rounded]="true"
                [text]="true"
                (onClick)="deleteMaterial(material.slug)"
                pTooltip="Excluir Material"
              >
                <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <p-confirmDialog></p-confirmDialog>
</div>
