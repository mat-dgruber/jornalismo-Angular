<div class="card">
  <div class="flex justify-content-between mb-3">
    <h2>Gerenciar Projetos</h2>
    <p-button
      label="Novo Projeto"
      icon="pi pi-plus"
      routerLink="/projetos/novo"
    ></p-button>
  </div>

  <p-table
    [value]="projetos"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%">Imagem</th>
        <th style="width: 30%">Título</th>
        <th style="width: 20%">Tipo</th>
        <th style="width: 15%">Data</th>
        <th style="width: 20%">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-projeto>
      <tr>
        <td>
          @if (projeto.imagem) {
          <img
            [src]="projeto.imagem"
            [alt]="projeto.titulo"
            width="80"
            class="shadow-4 border-round"
            style="object-fit: cover; aspect-ratio: 16/9"
          />
          }
        </td>
        <td class="font-bold">{{ projeto.titulo }}</td>
        <td>{{ projeto.tipo | titlecase }}</td>
        <td>{{ projeto.data_realizacao | date : "dd/MM/yyyy" }}</td>
        <td>
          <div class="flex gap-2">
            <p-button
              severity="info"
              [rounded]="true"
              [text]="true"
              [routerLink]="['/projetos/editar', projeto.id]"
              pTooltip="Editar"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
            </p-button>
            <p-button
              severity="danger"
              [rounded]="true"
              [text]="true"
              (onClick)="deleteProjeto(projeto.id!)"
              pTooltip="Excluir"
              tooltipPosition="top"
            >
              <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-confirmDialog></p-confirmDialog>
</div>
