<div class="admin-list-container">
  <div class="admin-list-card">
    <header class="admin-list-header">
      <h2>Gerenciar Projetos</h2>
      <p-button
        label="Novo Projeto"
        icon="pi pi-plus"
        routerLink="/projetos/novo"
        styleClass="btn-admin-main"
      ></p-button>
    </header>

    <p-table
      [value]="projetos"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 12%">Capa</th>
          <th style="width: 35%">Título</th>
          <th style="width: 20%">Tipo</th>
          <th style="width: 13%">Data</th>
          <th style="width: 20%">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-projeto>
        <tr>
          <td>
            @if (projeto.imagem) {
              <img
                [src]="projeto.imagem"
                [alt]="projeto.titulo"
                width="70"
                class="shadow-2 border-round"
                style="object-fit: cover; aspect-ratio: 16/9"
              />
            } @else {
              <div class="bg-light border-round flex align-center justify-center" style="width: 70px; aspect-ratio: 16/9">
                <i class="pi pi-image text-secondary"></i>
              </div>
            }
          </td>
          <td class="font-bold text-primary">{{ projeto.titulo }}</td>
          <td>
            <span class="status-tag" [ngClass]="projeto.tipo === 'academico' ? 'status-tag-info' : 'status-tag-warning'">
              {{ projeto.tipo | titlecase }}
            </span>
          </td>
          <td class="text-secondary">{{ projeto.data_realizacao | date : "dd/MM/yyyy" }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                severity="info"
                [rounded]="true"
                [text]="true"
                [routerLink]="['/projetos/editar', projeto.slug]"
                pTooltip="Editar Projeto"
              >
                <lucide-icon [img]="Pencil" class="w-4 h-4"></lucide-icon>
              </p-button>
              <p-button
                severity="danger"
                [rounded]="true"
                [text]="true"
                (onClick)="deleteProjeto(projeto.slug!)"
                pTooltip="Excluir Projeto"
              >
                <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <p-confirmDialog></p-confirmDialog>
</div>
