<div class="container">
  <a routerLink="/blog" class="back-fab" aria-label="Voltar">
    <lucide-icon [img]="arrowLeft" size="24"></lucide-icon>
  </a>

  @if (postResource.isLoading()) {
    <article class="post-detail">
      <header>
        <p-skeleton
          width="100%"
          height="350px"
          borderRadius="12px"
          styleClass="mb-4"
        ></p-skeleton>
        <p-skeleton
          width="80%"
          height="3rem"
          styleClass="mb-3 mx-auto"
        ></p-skeleton>
        <p-skeleton
          width="40%"
          height="1.3rem"
          styleClass="mb-4 mx-auto"
        ></p-skeleton>
        <hr />
        <div class="meta flex justify-center">
          <p-skeleton
            width="200px"
            height="1rem"
            styleClass="mx-auto"
          ></p-skeleton>
        </div>
        <hr />
      </header>
      <div class="content">
        <p-skeleton width="100%" height="1rem" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="100%" height="1rem" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="90%" height="1rem" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="95%" height="1rem" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="60%" height="1rem" styleClass="mb-4"></p-skeleton>

        <p-skeleton width="100%" height="1rem" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="100%" height="1rem" styleClass="mb-2"></p-skeleton>
        <p-skeleton width="85%" height="1rem" styleClass="mb-2"></p-skeleton>
      </div>
    </article>
  } @else if (postResource.error()) {
    <div class="error-state">
      <p>Erro ao carregar o post. Verifique sua conexão.</p>
      <button (click)="postResource.reload()">Tentar novamente</button>
    </div>
  } @else if (postResource.value(); as p) {
    <article class="post-detail">
      <header>
        <img [src]="p.image" [alt]="p.title" class="post-banner" />
        <h1>{{ p.title }}</h1>
        <p class="subtitle">{{ p.subtitle }}</p>
        <hr />
        <div class="meta">
          <span>Por: {{ p | authorName }}</span> |
          <span>Data: {{ p.published_date | date: "dd/MM/yyyy" }}</span>
        </div>
        <hr />
      </header>

      <!--
    @if (p.image) {
    <div class="image-wrapper">
      <img [src]="p.image" [alt]="p.title">
    </div>
    }
-->

      <div class="content" [innerHTML]="p.content"></div>
    </article>
  }
</div>
