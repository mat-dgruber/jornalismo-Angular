<div class="container">
  <h2>Nova Postagem</h2>

  <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Título</label>
      <input
        pInputText
        id="title"
        type="text"
        formControlName="title"
        placeholder="Título do Post"
        class="w-full"
      />
      @if (postForm.get('title')?.invalid && postForm.get('title')?.touched) {
      <small class="error">O título é obrigatório (mín. 5 letras).</small>
      }
    </div>

    <div class="form-group">
      <label for="subtitle">Subtítulo</label>
      <input
        pInputText
        id="subtitle"
        type="text"
        formControlName="subtitle"
        placeholder="Resumo curto"
        class="w-full"
      />
    </div>

    <div class="form-group">
      <label for="author">Autor</label>
      <p-select
        [options]="users"
        formControlName="author"
        optionLabel="first_name"
        optionValue="username"
        placeholder="Selecione um autor"
        class="w-full"
      ></p-select>
    </div>

    <div class="form-group">
      <label for="image">Imagem de Capa</label>
      <div class="file-upload-wrapper">
        <input
          id="image"
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="file-input"
        />
        <div class="file-upload-button" (click)="fileInput.click()">
          <i class="pi pi-upload"></i> Escolher Imagem
        </div>
        <span class="file-name" *ngIf="selectedFile">{{
          selectedFile.name
        }}</span>
        <span class="file-name" *ngIf="!selectedFile"
          >Nenhum arquivo selecionado</span
        >
      </div>
      <!-- Hidden ref for click trigger -->
      <input
        #fileInput
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        style="display: none"
      />
    </div>

    <div class="form-group">
      <label for="content">Conteúdo</label>
      <p-editor
        formControlName="content"
        [style]="{ height: '320px' }"
      ></p-editor>
    </div>

    <div class="form-actions">
      <p-button
        label="Publicar Post"
        type="submit"
        [disabled]="postForm.invalid"
        styleClass="w-full"
      ></p-button>
    </div>
  </form>
</div>
