<div class="container">
  <h2>Nova Postagem</h2>

  <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Título</label>
      <input
        pInputText
        id="title"
        type="text"
        formControlName="title"
        placeholder="Título do Post"
        class="w-full"
      />
      @if (postForm.get('title')?.invalid && postForm.get('title')?.touched) {
      <small class="error">O título é obrigatório (mín. 5 letras).</small>
      }
    </div>

    <div class="form-group">
      <label for="subtitle">Subtítulo</label>
      <input
        pInputText
        id="subtitle"
        type="text"
        formControlName="subtitle"
        placeholder="Resumo curto"
        class="w-full"
      />
    </div>

    <div class="form-group">
      <label for="author">Autor</label>
      <p-select
        [options]="users"
        formControlName="author"
        optionLabel="first_name"
        optionValue="username"
        placeholder="Selecione um autor"
        class="w-full"
      ></p-select>
    </div>

    <div class="form-group">
      <label for="image">Imagem de Capa</label>
      <div class="file-upload-wrapper">
        <input
          id="image"
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="file-input"
        />
        <div class="file-upload-button" (click)="fileInput.click()">
          <i class="pi pi-upload"></i> Escolher Imagem
        </div>
        @if (selectedFile) {
        <span class="file-name">{{ selectedFile.name }}</span>
        } @else {
        <span class="file-name">Nenhum arquivo selecionado</span>
        }
      </div>
      <!-- Hidden ref for click trigger -->
      <input
        #fileInput
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        style="display: none"
      />
    </div>

    <div class="form-group">
      <label for="content">Conteúdo</label>
      <p-editor formControlName="content" [style]="{ height: '400px' }">
        <p-header>
          <span class="ql-formats">
            <select class="ql-header">
              <option value="1">Título 1</option>
              <option value="2">Título 2</option>
              <option value="3">Título 3</option>
              <option selected>Normal</option>
            </select>
            <select class="ql-font"></select>
          </span>
          <span class="ql-formats">
            <button class="ql-bold" aria-label="Negrito"></button>
            <button class="ql-italic" aria-label="Itálico"></button>
            <button class="ql-underline" aria-label="Sublinhado"></button>
            <button class="ql-strike" aria-label="Tachado"></button>
          </span>
          <span class="ql-formats">
            <select class="ql-color"></select>
            <select class="ql-background"></select>
          </span>
          <span class="ql-formats">
            <button class="ql-list" value="ordered" aria-label="Lista Ordenada"></button>
            <button class="ql-list" value="bullet" aria-label="Lista com Marcadores"></button>
            <select class="ql-align"></select>
          </span>
          <span class="ql-formats">
            <button class="ql-link" aria-label="Inserir Link"></button>
            <button class="ql-image" aria-label="Inserir Imagem"></button>
            <button class="ql-video" aria-label="Inserir Vídeo"></button>
            <button class="ql-blockquote" aria-label="Citação"></button>
            <button class="ql-code-block" aria-label="Bloco de Código"></button>
          </span>
          <span class="ql-formats">
            <button class="ql-clean" aria-label="Limpar Formatação"></button>
          </span>
        </p-header>
      </p-editor>
    </div>

    <div class="form-actions">
      <p-button
        label="Publicar Post"
        type="submit"
        [disabled]="postForm.invalid"
        styleClass="w-full"
      ></p-button>
    </div>
  </form>
</div>
