<div class="container">
  <h2>Nova Postagem</h2>

  <form [formGroup]="postForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="title">Título</label>
      <input id="title" type="text" formControlName="title" placeholder="Título do Post">
      @if (postForm.get('title')?.invalid && postForm.get('title')?.touched) {
      <small class="error">O título é obrigatório (mín. 5 letras).</small>
      }
    </div>

    <div class="form-group">
      <label for="subtitle">Subtítulo</label>
      <input id="subtitle" type="text" formControlName="subtitle" placeholder="Resumo curto">
    </div>

    <div class="form-group">
      <label for="author">Autor</label>
      <p-select [options]="users" formControlName="author" optionLabel="first_name" optionValue="username" placeholder="Selecione um autor" styleClass="w-full"></p-select>
    </div>

    <div class="form-group">
      <label for="image">Imagem de Capa</label>
      <input id="image" type="file" (change)="onFileSelected($event)" accept="image/*">
    </div>

    <div class="form-group">
      <label for="content">Conteúdo</label>
      <p-editor formControlName="content" [style]="{ height: '320px' }"></p-editor>
    </div>

    <button type="submit" [disabled]="postForm.invalid">Publicar Post</button>
  </form>
</div>
