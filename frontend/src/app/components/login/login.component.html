<div class="login-container">
  <div class="login-card">
    <h1>Bem-vindo</h1>
    <p>Faça login para gerenciar o conteúdo</p>

    <form [formGroup]="loginForm" (ngSubmit)="loginEmail()" class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          pInputText
          id="email"
          formControlName="email"
          class="w-full"
          placeholder="email@exemplo.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <p-password
          id="password"
          formControlName="password"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full"
          placeholder="Sua senha"
        ></p-password>
      </div>

      <p-button
        label="Entrar"
        type="submit"
        [disabled]="loginForm.invalid"
        styleClass="w-full"
      ></p-button>
    </form>

    <div class="divider">
      <span>OU</span>
    </div>

    <p-button
      label="Continuar com Google"
      icon="pi pi-google"
      (onClick)="loginGoogle()"
      severity="secondary"
      styleClass="w-full"
    ></p-button>
  </div>
</div>
