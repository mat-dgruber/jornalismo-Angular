<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Portfólio de Jornalismo Teológico - Maria Izabela</title>
    <link rel="icon" href="data:,">
    <style>
        /* Global Styles from src/styles.css */
        @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Quintessential&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2b0053;
            --secondary-color: #c180ffe3;
            --text-color: #202020;
            --light-text-color: #fff0f0;
            --bg-light: #C8B4C0;
            --background-color: #F9F7F7;
            --font-heading: 'Newsreader', serif;
            --font-body: 'Jost', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3rem;
            margin-bottom: 20px;
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            margin-bottom: 40px;
        }
        
        main {
            flex: 1;
            text-align: center;
            padding: 80px 20px;
        }

        /* Header Styles from src/app/header/header.css */
        .header {
            background-color: var(--primary-color);
            color: var(--light-text-color);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 20px;
        }

        a {
            color: var(--light-text-color);
            text-decoration: none;
        }

        .nav-links a {
            color: var(--light-text-color);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--secondary-color);
        }

        .menu-toggle {
            display: none;
            font-size: 2rem;
            background: none;
            border: none;
            color: var(--light-text-color);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .header .container {
                justify-content: space-between;
                align-items: center;
                text-align: initial;
            }
            
            .nav-links {
                display: none; /* Hidden by default on mobile */
                flex-direction: column;
                width: 100%;
                text-align: center;
                background-color: var(--primary-color);
                position: absolute;
                top: 60px;
                left: 0;
                transform: translateY(-150%);
                transition: transform 0.5s ease-out;
            }

            .nav-links.active {
                display: flex;
                transform: translateY(0);
            }

            .nav-links li {
                margin: 10px 0;
            }

            .menu-toggle {
                display: block;
            }
        }

        /* Footer Styles from src/app/footer/footer.css */
        .footer {
            background-color: var(--primary-color);
            color: var(--light-text-color);
            padding: 20px 0;
            text-align: center;
        }
        
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--light-text-color);
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s ease;
            margin-top: 30px;
            border: 1px solid transparent;
        }

        .btn:hover {
            background-color: #3b008db4;
        }

    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="/">Maria Izabela</a></h1>
            <nav class="navbar">
                <button class="menu-toggle" aria-label="Abrir menu" onclick="toggleMenu()">&#9776;</button>
                <ul class="nav-links" id="nav-links">
                    <li><a href="/#materias">Matérias Escritas</a></li>
                    <li><a href="/#projetos">Projetos</a></li>
                    <li><a href="/#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>404 - Página Não Encontrada</h1>
            <p>A página que você está procurando não existe ou foi movida.</p>
            <a routerLink="/" class="btn">Voltar para a página inicial</a>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Maria Izabela. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('nav-links');
            navLinks.classList.toggle('active');
        }
    </script>

</body>
</html>
