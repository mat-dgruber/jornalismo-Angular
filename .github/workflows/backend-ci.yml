name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dependencies
      run: uv sync

    - name: Run Tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        # Add minimal dummy env vars for tests if needed
        SECRET_KEY: "dummy-key-for-tests"
        DATABASE_URL: "sqlite:///:memory:"
      run: uv run python manage.py test

    - name: Google Auth
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: 'Configure Docker'
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

    - name: Build and Push Container
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker build -t southamerica-east1-docker.pkg.dev/portfolio-jornalismo/jornalismo-repo/backend-api:latest .
        docker push southamerica-east1-docker.pkg.dev/portfolio-jornalismo/jornalismo-repo/backend-api:latest

    - name: Deploy to Cloud Run
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        gcloud run deploy jornalismo-api \
          --image southamerica-east1-docker.pkg.dev/portfolio-jornalismo/jornalismo-repo/backend-api:latest \
          --region southamerica-east1 \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},DEBUG=False,GS_BUCKET_NAME=${{ secrets.GS_BUCKET_NAME }},FIREBASE_PROJECT_ID=portfolio-jornalismo,SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }},ALLOWED_HOSTS=*"
